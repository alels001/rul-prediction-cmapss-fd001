# Training configuration for the production XGBoost model.
# Values reproduce the final configuration of the thesis (Table 6.6).
# Changing any of them produces a different model, so treat edits as a new
# experiment and record the resulting metrics.

model_version: "1.0.0"

target:
  r_max: 125            # piecewise-linear cap (Section 6.4)

xgboost:
  n_estimators: 300
  max_depth: 8
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  objective: "reg:squarederror"
  random_state: 42
  n_jobs: -1
